name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    # macOS runner: the darwin targets link against the real Xcode SDK, and zig
    # cross-compiles the linux targets from there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: mlugg/setup-zig@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
      - run: cargo test --workspace --exclude rocket-desktop --locked
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Also publishes Casks/rocket.rb to main (contents: write above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
