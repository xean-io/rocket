name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./... && go vet -tags integration ./...
      - run: go test -race ./...
      # The e2e fixture's python3 http.server does not become healthy within its
      # 20s probe window on GitHub macOS runners; it passes on macOS dev machines.
      - if: runner.os == 'Linux'
        run: go test -tags integration ./...

  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: GOOS=windows go build ./...
      - run: GOOS=linux GOARCH=arm64 go build ./...
