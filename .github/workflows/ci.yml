name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # CLI + daemon workspace. rocket-desktop (Tauri) is excluded here: compiling it
  # on Linux needs webkit2gtk system packages and a built frontend (`dist`), so it
  # is checked once, on macOS, in the `desktop` job below.
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude rocket-desktop --all-targets -- -D warnings
      - run: cargo clippy -p rocket-cli -p rocket-daemon --features rocket-cli/e2e,rocket-daemon/e2e --all-targets -- -D warnings
      - run: cargo test --workspace --exclude rocket-desktop
      # The e2e fixture's python3 http.server does not become healthy within its
      # 20s probe window on GitHub macOS runners; it passes on macOS dev machines.
      - if: runner.os == 'Linux'
        run: cargo test -p rocket-cli -p rocket-daemon --features rocket-cli/e2e,rocket-daemon/e2e

  desktop:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test --run
      - run: pnpm build
      # The Tauri crate embeds the built frontend (`dist`), so it is checked after `pnpm build`.
      - run: cargo clippy -p rocket-desktop --all-targets -- -D warnings
      - run: cargo test -p rocket-desktop
