[package]
name = "rocket-desktop"
description = "Rocket desktop app (Tauri shell over the rocket daemon API)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# The `_lib` suffix keeps the library name distinct from the binary on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "rocket_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
rocket-client = { path = "../../../crates/rocket-client" }
rocket-domain = { path = "../../../crates/rocket-domain", features = ["ts"] }
futures-util.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tauri-plugin-clipboard-manager.workspace = true
tauri-plugin-dialog.workspace = true
tauri-plugin-opener.workspace = true
time.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }
ts-rs.workspace = true
uuid.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance.workspace = true
tauri-plugin-process.workspace = true
tauri-plugin-updater.workspace = true
tauri-plugin-window-state.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
