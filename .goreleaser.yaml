# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: rocket

# Rust build via cargo-zigbuild (no CGO-style toolchain juggling per target).
# The runner must provide rustup/cargo, zig and cargo-zigbuild; GoReleaser only
# runs `rustup target add` for each target below. See .github/workflows/release.yml.
#
# Windows is not shipped: the process adapter is a stub there and the bundled
# SQLite C sources could not be cross-compiled without a Windows sysroot.
builds:
  - id: rocket
    builder: rust
    binary: rocket
    targets:
      - x86_64-apple-darwin
      - aarch64-apple-darwin
      - x86_64-unknown-linux-gnu
      - aarch64-unknown-linux-gnu
    flags:
      - --release
      - --locked
      - -p=rocket-cli
    env:
      # Read by crates/rocket-cli/src/version.rs (`rocket version`).
      - ROCKET_VERSION={{ .Version }}

archives:
  - id: rocket
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: xean-io
    name: rocket

# This repo doubles as its own Homebrew tap (Casks/ on main), so the release
# workflow's GITHUB_TOKEN can publish the cask without a cross-repo secret:
#   brew tap xean-io/rocket https://github.com/xean-io/rocket
#   brew install --cask xean-io/rocket/rocket
homebrew_casks:
  - name: rocket
    repository:
      owner: xean-io
      name: rocket
      branch: main
    directory: Casks
    commit_msg_template: "chore(brew): update cask to {{ .Tag }}"
    homepage: https://github.com/xean-io/rocket
    description: Supervise dev processes for humans and AI agents
    license: MIT
    hooks:
      post:
        # Binaries are not notarized; drop the quarantine bit so macOS runs them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rocket"]
          end
