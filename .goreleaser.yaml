# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: rocket

before:
  hooks:
    - go mod tidy

builds:
  - id: rocket
    main: ./cmd/rocket
    binary: rocket
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: rocket
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: xean-io
    name: rocket

# This repo doubles as its own Homebrew tap (Casks/ on main), so the release
# workflow's GITHUB_TOKEN can publish the cask without a cross-repo secret:
#   brew tap xean-io/rocket https://github.com/xean-io/rocket
#   brew install --cask xean-io/rocket/rocket
homebrew_casks:
  - name: rocket
    repository:
      owner: xean-io
      name: rocket
      branch: main
    directory: Casks
    commit_msg_template: "chore(brew): update cask to {{ .Tag }}"
    homepage: https://github.com/xean-io/rocket
    description: Supervise dev processes for humans and AI agents
    license: MIT
    hooks:
      post:
        # Binaries are not notarized; drop the quarantine bit so macOS runs them.
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/rocket"]
          end
