# rocket.yaml generated by `rocket init`; review the guesses before use.
# Schema: `rocket schema`. Docs: see the rocket README.
# note: services only in docker-compose.yaml (env smoke, not added): control-plane
# note: compose.yaml and docker-compose.yaml share the compose project name "xean-spectrai"; rocket forces rocket-autodropshipping-<env> per env, so their volumes no longer collide
version: 1
name: autodropshipping
dotenv: [".env"]
default_env: dev
envs:
  dev: { compose: [compose.yaml] }
  # guessed from docker-compose.yaml; rename it (e.g. prod-local) if that is your production stack
  smoke: { compose: [docker-compose.yaml] }
  # stage: { deploy: { task: "release:stage", confirm: true } }
setup:
  install: { task: install }
  migrate: { task: "db:migrate" }
services:
  minio:
    compose: minio
    profiles: [ops]
    ports:
      p9000: { default: 9000, env: MINIO_PORT }
      p9001: { default: 9001, env: MINIO_CONSOLE_PORT }
  postgres:
    compose: postgres
    profiles: [deps]
    ports:
      main: { default: 5432, env: POSTGRES_PORT }
  redis:
    compose: redis
    profiles: [deps]
    ports:
      # published as a literal port: rocket cannot remap it when busy (use ${VAR:-6379} in compose)
      main: { default: 6379 }
  worker:
    compose: worker
    profiles: [apps]
  cp-dev:
    task: "cp:dev"
    # long-running guess; declare its ports so rocket can probe and remap, e.g.
    # ports: { http: { default: 3000, env: PORT } }
  dev:
    task: dev
    # long-running guess; declare its ports so rocket can probe and remap, e.g.
    # ports: { http: { default: 3000, env: PORT } }
groups:
  containers: [minio, postgres, redis, worker]
  dev-tasks: [cp-dev, dev]
  all: ["*"]
pipelines:
  "cp:test": [{ task: "cp:test" }]
  "infra:down": [{ task: "infra:down" }]
  "infra:up": [{ task: "infra:up" }]
  lint: [{ task: lint }]
  test: [{ task: test }]
# Deploy-looking tasks (not added as pipelines; wire them as envs.<name>.deploy with confirm: true):
#   - deploy:prod
#   - release:ci
# Taskfile tasks detected (any of them runs with `rocket run <task>`):
#   - cp:dev — Control plane dev server
#   - cp:test
#   - db:migrate — Apply migrations
#   - deploy:prod
#   - dev — Start the dev stack
#   - infra:down
#   - infra:up
#   - install — Install dependencies
#   - lint
#   - release:ci
#   - test — Run unit tests
