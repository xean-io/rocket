# rocket.yaml generated by `rocket init`; review the guesses before use.
# Schema: `rocket schema`. Docs: see the rocket README.
# note: services only in compose.staging.yml (env staging, not added): cache
# note: compose.prod.yaml and compose.staging.yml share the compose project name "shop"; rocket forces rocket-only-suffixed-<env> per env, so their volumes no longer collide
version: 1
name: only-suffixed
default_env: dev
envs:
  dev: { compose: [compose.prod.yaml] }
  # guessed from compose.staging.yml; rename it (e.g. prod-local) if that is your production stack
  staging: { compose: [compose.staging.yml] }
  # stage: { deploy: { task: "release:stage", confirm: true } }
services:
  db:
    compose: db
    profiles: [data]
    ports:
      # published as a literal port: rocket cannot remap it when busy (use ${VAR:-5432} in compose)
      p5432: { default: 5432 }
      p5433: { default: 6000, env: PGX }
  web:
    compose: web
    ports:
      main: { default: 8080, env: WEB_PORT }
groups:
  containers: [db, web]
  all: ["*"]
