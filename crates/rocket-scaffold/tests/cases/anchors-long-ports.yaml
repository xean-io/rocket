# rocket.yaml generated by `rocket init`; review the guesses before use.
# Schema: `rocket schema`. Docs: see the rocket README.
# note: services only in docker-compose.yml (env smoke, not added): e
# note: services only in compose.smoke.yaml (env smoke-alt, not added): d
version: 1
name: anchors-long-ports
default_env: dev
envs:
  dev: { compose: [compose.yaml, compose.override.yaml] }
  # guessed from docker-compose.yml; rename it (e.g. prod-local) if that is your production stack
  smoke: { compose: [docker-compose.yml] }
  # guessed from compose.smoke.yaml; rename it (e.g. prod-local) if that is your production stack
  smoke-alt: { compose: [compose.smoke.yaml] }
  # stage: { deploy: { task: "release:stage", confirm: true } }
services:
  a:
    compose: a
    profiles: [base]
    ports:
      # published as a literal port: rocket cannot remap it when busy (use ${VAR:-7000} in compose)
      main: { default: 7000 }
  b:
    compose: b
    profiles: [base]
    ports:
      p80: { default: 9090, env: B_PORT }
      # published as a literal port: rocket cannot remap it when busy (use ${VAR:-9091} in compose)
      p81: { default: 9091 }
      # published as a literal port: rocket cannot remap it when busy (use ${VAR:-8082} in compose)
      p82: { default: 8082 }
  c:
    compose: c
    ports:
      main: { default: 1234, env: C_PORT }
groups:
  containers: [a, b, c]
  all: ["*"]
