version: 1
name: nested-tasks
setup:
  doctor: { task: doctor }
  migrate: { task: migrate }
services:
  app-dev:
    task: "app:dev"
    # long-running guess; declare its ports so rocket can probe and remap, e.g.
    # ports: { http: { default: 3000, env: PORT } }
  serve:
    task: serve
    # long-running guess; declare its ports so rocket can probe and remap, e.g.
    # ports: { http: { default: 3000, env: PORT } }
  start:
    task: start
    # long-running guess; declare its ports so rocket can probe and remap, e.g.
    # ports: { http: { default: 3000, env: PORT } }
  sub-deep-dev:
    task: "sub:deep:dev"
    # long-running guess; declare its ports so rocket can probe and remap, e.g.
    # ports: { http: { default: 3000, env: PORT } }
  sub-dev:
    task: "sub:dev"
    # long-running guess; declare its ports so rocket can probe and remap, e.g.
    # ports: { http: { default: 3000, env: PORT } }
  web-dev:
    task: "web:dev"
    # long-running guess; declare its ports so rocket can probe and remap, e.g.
    # ports: { http: { default: 3000, env: PORT } }
groups:
  dev-tasks: [app-dev, serve, start, sub-deep-dev, sub-dev, web-dev]
  all: ["*"]
pipelines:
  dev-server: [{ task: dev-server }]
  "sub:build": [{ task: "sub:build" }]
  "test:unit": [{ task: "test:unit" }]
